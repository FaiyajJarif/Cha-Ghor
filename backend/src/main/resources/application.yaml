# backend/src/main/resources/application.yaml
spring:
  application:
    name: cha-ghor-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/chaghor}   # host port 5433 (5432 is busy)
    username: ${DB_USERNAME:chaghor}
    password: ${DB_PASSWORD:chaghor_dev_pw}   # override in every real environment
    driver-class-name: org.postgresql.Driver

    # ==================================================================
    # POOL AND TIMEOUTS - the difference between "slow" and "everyone stuck".
    # ==================================================================
    #
    # Nothing was configured here, so Spring's defaults applied: 10 connections
    # and NO query timeout. One accidental full-table scan holds a connection
    # indefinitely and the eleventh concurrent request queues behind it with no
    # upper bound. That is how a single bad query becomes an outage.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      # Fail fast rather than stacking up threads that will time out at the
      # client anyway.
      connection-timeout: 10000
      max-lifetime: 1800000
      idle-timeout: 600000
      # HARD CEILING ON ANY SINGLE QUERY, enforced by Postgres itself so the
      # connection is genuinely released instead of being held by a client that
      # has already given up.
      data-source-properties:
        options: "-c statement_timeout=15000"

  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only validates
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true             # runs V1__init.sql on startup
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

  # ======================================================================
  # HTTPS - OFF BY DEFAULT, ON WITH ONE ENV VAR.
  # ======================================================================
  #
  # Without TLS every JWT, password and 4-digit PIN crosses the wifi in clear
  # text, and anyone on the same network can read a token and replay it as that
  # user. For an estate demo on a shared network that is the single biggest
  # confidentiality gap in the system.
  #
  # It is OFF by default on purpose. Turning it on unconditionally would break
  # the plain-HTTP setup you are testing from a phone right now, and a
  # self-signed certificate makes a mobile browser show a full-page warning that
  # has to be accepted before anything loads -- including, separately, before
  # the WebSocket will connect.
  #
  # To enable:
  #   ./scripts/gen-dev-cert.sh          # writes backend/src/main/resources/dev-keystore.p12
  #   APP_SSL_ENABLED=true ./mvnw spring-boot:run
  #
  # Then use https://<ip>:8080 and accept the warning once on each device.
  # In production use a real certificate and set the three variables below.
  ssl:
    enabled: ${APP_SSL_ENABLED:false}
    key-store: ${APP_SSL_KEYSTORE:classpath:dev-keystore.p12}
    key-store-password: ${APP_SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: ${APP_SSL_KEY_ALIAS:chaghor}
  error:
    include-message: on_param        # only echo the exception message when ?message=... is passed
    include-stacktrace: never        # never leak stack traces to clients
    include-binding-errors: never    # validation details come from GlobalExceptionHandler instead

# App-specific config
app:
  # Where complaint / field-report evidence is written. Relative paths resolve
  # against the backend's working directory, so the default puts files in
  # backend/uploads/cases/. Point this somewhere persistent for a real deploy --
  # the directory is created on first upload if it does not exist.
  uploads:
    dir: ${APP_UPLOADS_DIR:uploads}
  # Weather for the supervisor dashboard. Open-Meteo is free and needs no API
  # key, so a fresh clone works with no setup and there is no second secret to
  # manage. Coordinates default to Sylhet. Set enabled=false to stop the backend
  # making any outbound call at all -- reads then serve the last stored reading.
  weather:
    latitude: ${APP_WEATHER_LAT:24.8949}
    longitude: ${APP_WEATHER_LON:91.8687}
    enabled: ${APP_WEATHER_ENABLED:true}
    # Fetch a fresh reading every hour, at five past.
    #
    # Until this existed the ONLY trigger was a supervisor pressing Refresh, so
    # the harvest advice, the yield forecast's rain factor, the pluck advisor's
    # weather note and the field-condition suggestion could all be working from
    # a reading days old without saying so. Open-Meteo is free and keyless, so
    # 24 calls a day costs nothing.
    refresh-cron: ${APP_WEATHER_REFRESH_CRON:0 5 * * * *}
    # Daily retention pass, 03:30. Readings are NEVER deleted -- this only drops
    # the hourly/7-day prediction arrays off blobs from before today, which are
    # 96% of a row's size and are forecasts about a day that has already
    # happened. Temperature, humidity, rainfall and condition are kept forever,
    # because the yield forecast is meant to learn from them.
    prune-cron: ${APP_WEATHER_PRUNE_CRON:0 30 3 * * *}
  security:
    # Reverse proxies permitted to set X-Forwarded-For on behalf of a client.
    #
    # EMPTY means "trust nothing but the TCP socket", which is correct when the
    # backend is reached directly. X-Forwarded-For is an ordinary request header
    # that any caller can set, so honouring it from an untrusted peer lets an
    # attacker land every login attempt in a fresh rate-limit bucket.
    #
    # Put nginx / your load balancer address here if you add one, e.g.
    #   APP_SECURITY_TRUSTED_PROXIES=10.0.0.5,10.0.0.6
    trusted-proxies: ${APP_SECURITY_TRUSTED_PROXIES:}
  jwt:
    # THIS DEFAULT IS PUBLIC. It is in the git history of this repository, so
    # anyone who can read the source can sign a token that says they are an
    # admin -- no password involved.
    #
    # It stays here because a fresh clone should run with no setup, and it is
    # now SAFE to keep: JwtService refuses to start on this value unless the
    # dev/local/test profile is active (or no profile is set at all, i.e. a
    # laptop). Any real deployment must set APP_JWT_SECRET or it will not boot.
    #
    # Minimum 48 characters -- HS384 signs with a 384-bit key.
    secret: ${APP_JWT_SECRET:dev-only-chaghor-secret-a1b2c3d4e5f60718293a4b5c6d7e8f90}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}   # 24h
  ai:
    service:
      url: ${AI_SERVICE_URL:http://127.0.0.1:8000}   # FIXED: now correctly nested under app.ai.service.url
  cors:
    # Comma-separated browser origins allowed to call the API.
    #
    # This ALSO controls the WebSocket handshake (see WebSocketConfig), so the
    # REST API and the live sockets cannot drift apart. Sockets accept these as
    # PATTERNS, so a wildcard works for a LAN address that changes:
    #
    #   APP_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://192.168.*.*:5173
    #
    # Needed to demo the supervisor screens on a phone. Without the phone's
    # origin listed, the page loads but every socket is rejected at the
    # handshake and the live badges sit on "Offline".
    # Comma-separated PATTERNS (not exact origins) — see SecurityConfig.
    #
    # The three private IPv4 ranges are included so a phone on the same wifi
    # can reach the app with no configuration. They are LAN-only addresses:
    # nothing routable from the internet matches them, so this does not open
    # the API to the world. Narrow it to your real domain in production by
    # setting APP_CORS_ALLOWED_ORIGINS.
    # BOTH SCHEMES. Turning on APP_SSL_ENABLED changes every browser origin
    # from http:// to https://, and an allowlist holding only http entries
    # would reject every request the moment TLS was switched on -- a failure
    # that looks like the backend being down rather than a CORS rule.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.*.*:5173,http://10.*.*.*:5173,http://172.16.*.*:5173,https://localhost:5173,https://127.0.0.1:5173,https://192.168.*.*:5173,https://10.*.*.*:5173,https://172.16.*.*:5173}
  # Estate warehouse shown on the Supply Chain live map.
  warehouse:
    name: Chaghor Central Warehouse - Srimangal
    lat: 24.3065
    lng: 91.7296

# ---------------------------------------------------------------------------
# SMS transport
# ---------------------------------------------------------------------------
# Which SmsSender implementation is active. Exactly one is, chosen by this value
# via @ConditionalOnProperty: mock | macmessages | bulksmsbd | sslwireless.
#
# macmessages is the estate's transport: the backend drives Messages.app on the
# Mac it runs on, which sends a real SMS out through the paired iPhone's SIM via
# Text Message Forwarding. See MacMessagesSmsSender.
#
# SETTING THIS DOES NOT SEND ANYTHING ON ITS OWN, and that is deliberate.
# app_setting.sms_enabled (V43) defaults to FALSE, so a freshly configured
# system still transmits nothing until an admin arms it in Settings. Two
# independent gates: the transport here, the decision there.
#
# Override per-run without editing this file:
#   SMS_PROVIDER=mock ./mvnw spring-boot:run
sms:
  provider: ${SMS_PROVIDER:macmessages}
  macmessages:
    # How long to wait for osascript before giving up. A stalled Messages.app
    # must not hang a web request.
    timeout-seconds: ${SMS_MACMESSAGES_TIMEOUT:20}

logging:
  level:
    # Dialed down from DEBUG/TRACE: those leak tokens, headers, and auth internals
    # into logs. Raise temporarily only when debugging auth locally.
    org.springframework.security: INFO
    org.springframework.security.web: INFO

name: CI

# Runs on every pull request into main, and on anything pushed to main
# directly (which the ruleset should be preventing, but belt and braces).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to the same PR cancels the first run still in flight.
# Without this, three quick pushes queue three full builds and the last
# answer arrives long after it mattered.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- backend
  backend:
    name: Backend — build and unit tests
    runs-on: ubuntu-latest

    # ChaghorApplicationTests is a @SpringBootTest: it boots the whole
    # application, so it needs a real database. Without this the job failed
    # after ~36s on a connection refused to localhost:5433, which reads like a
    # broken build and is actually a missing service.
    #
    # pgvector/pgvector, NOT the stock postgres image: V1__init.sql creates
    # document_embedding.embedding as VECTOR(1536), and stock postgres has no
    # such type, so Flyway dies on the first migration.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: chaghor
          POSTGRES_USER: chaghor
          POSTGRES_PASSWORD: chaghor_dev_pw
        ports:
          - 5432:5432
        # Without the health check the job races the container and connects
        # before Postgres is accepting connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 5432 here, not the 5433 used locally: the port clash that 5433 avoids
      # on a developer laptop does not exist on a clean runner.
      DB_URL: jdbc:postgresql://localhost:5432/chaghor
      DB_USERNAME: chaghor
      DB_PASSWORD: chaghor_dev_pw

      # JwtService refuses to start on the built-in development key unless the
      # dev profile is active, and demands at least 48 bytes. This value is
      # throwaway and CI-only -- it signs nothing anyone will ever hold.
      APP_JWT_SECRET: ci-only-throwaway-secret-not-used-anywhere-real-0123456789

      # Keep CI off the network for anything optional.
      APP_SMS_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      # Java 17 because backend/pom.xml declares <java.version>17</java.version>.
      # CLAUDE.md section 5 says 21; the pom is what actually compiles. If you
      # move to 21, change the pom FIRST, test, then bump this.
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # -DskipTests is NOT used here: the point of CI is to run them.
      # But the Selenium suite is excluded by default in the pom
      # (<surefire.excludedGroups>selenium</surefire.excludedGroups>), because
      # those drive a real browser against a running server and cannot pass on
      # a bare runner. They stay a local job, see MANUAL_TEST.md.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify

  # --------------------------------------------------------------- frontend
  #
  # BUILD AND LINT ARE SEPARATE JOBS ON PURPOSE.
  #
  # The first run reported 128 problems (123 errors), overwhelmingly
  # `react-hooks/set-state-in-effect` -- a rule added in
  # eslint-plugin-react-hooks v7 that this codebase predates. None of it means
  # the app is broken; it is style debt against a rule that did not exist when
  # the code was written.
  #
  # Putting them in one job forced a choice between "lint blocks every merge"
  # and "delete lint entirely". Split, the BUILD is the required check (it
  # catches a bad import or broken JSX, which are real), and the LINT runs on
  # every PR, stays visible, and is NOT marked required until the backlog is
  # burnt down. Do not mark `Frontend — lint` required while it is red.
  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` not `npm install`: it installs exactly the lockfile and fails
      # if package.json and package-lock.json disagree, which is the whole
      # point of running this on a server rather than a laptop.
      - name: Install
        working-directory: frontend
        run: npm ci

      # A build that succeeds is a stronger signal than a lint that passes:
      # it catches a bad import or a broken JSX file that ESLint waves through.
      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-lint:
    name: Frontend — lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Reports, does not block. The count in the log is the burn-down number:
      # when it reaches zero, delete `continue-on-error` and make this required.
      - name: Lint
        working-directory: frontend
        continue-on-error: true
        run: npm run lint

  # -------------------------------------------------------------- ai_service
  ai-service:
    name: AI service — error check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      # NARROWED TO REAL ERRORS ONLY, DELIBERATELY.
      #
      # The full `ruff check .` reported 62 findings on the first run --
      # `re.M` instead of `re.MULTILINE`, an unpacked variable never used, a
      # file opened without a context manager. All worth fixing one day; none
      # of them a reason to block a merge.
      #
      # This selection is the classic "is it actually broken" set:
      #   E9  syntax errors
      #   F63 comparisons that are always true/false
      #   F7  syntax-level mistakes (break outside loop, etc.)
      #   F82 UNDEFINED NAMES -- the one that matters. A typo'd variable in a
      #       Python file is invisible until that line runs, which on this
      #       service means at request time, in front of a user.
      - name: Check for real errors
        working-directory: ai_service
        run: ruff check --select E9,F63,F7,F82 .

      # Everything else - style, formatting, modernisation - reports without
      # blocking. `ruff check --fix .` locally clears 36 of the 62; when the
      # count is zero, promote this to the step above.
      - name: Style (advisory)
        working-directory: ai_service
        continue-on-error: true
        run: |
          ruff check . || true
          ruff format --check . || true

  # ------------------------------------------------- commit message hygiene
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # fetch-depth 0 so we can see every commit on the branch, not just the tip
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deliberately a plain shell script rather than commitlint + husky.
      # husky runs on the developer's laptop and is skipped by `--no-verify`,
      # so it guarantees nothing; and adding commitlint would mean a root
      # package.json this repo does not otherwise need.
      #
      # The rule is loose on purpose: a type prefix and a real subject. Being
      # strict about scopes and body wrapping makes people fight the tool.
      - name: Check commit messages on this PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9 ._/-]+\))?!?: .{10,}'
          bad=0
          # %s is the subject line only. Merge commits are skipped: their
          # message is generated by GitHub and we do not control its wording.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              Merge\ *|Revert\ *) continue ;;
            esac
            if ! printf '%s' "$line" | grep -qE "$PATTERN"; then
              echo "::error::Bad commit message: $line"
              bad=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")

          if [ "$bad" -ne 0 ]; then
            cat <<'EOF'

          Commit messages must look like:

              feat(payroll): add overdraw recovery to the daily split
              fix(bkash): stop the slip creating its own batch
              docs: record the leaf grading measurement

          Allowed types:
              feat fix docs style refactor perf test build ci chore revert

          The subject needs at least 10 characters after the colon, so
          "fix: bug" is rejected and "fix: stop double-posting the loan slice"
          is not.

          To fix the last commit:      git commit --amend
          To fix several:              git rebase -i origin/main
          EOF
            exit 1
          fi
          echo "All commit messages look fine."

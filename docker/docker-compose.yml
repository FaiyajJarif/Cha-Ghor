# Cha Ghor - local Postgres (with pgvector) for dev.
services:
  chaghor-db:
    image: pgvector/pgvector:pg16      # Postgres 16 + pgvector baked in
    container_name: chaghor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chaghor
      POSTGRES_USER: chaghor
      POSTGRES_PASSWORD: chaghor_dev_pw
    ports:
      - "5433:5432"   # HOST:CONTAINER -> connect from your machine on 5433
    volumes:
      - chaghor_pgdata:/var/lib/postgresql/data      # data survives restarts
      - ./init:/docker-entrypoint-initdb.d           # runs once on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaghor -d chaghor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chaghor_pgdata: